spring.application.name=crm

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/crm
spring.datasource.username=crm_user
# пароль берется из переменной окружения DB_PASSWORD или из файла local.properties (он в .gitignore)
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./local.properties

# --- JPA ---
# таблицы создаются скриптом db/schema.sql, Hibernate только проверяет соответствие
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- приложение ---
# количество потоков для обработки сделок
crm.worker-threads=3
